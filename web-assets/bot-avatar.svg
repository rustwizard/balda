<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7ecd9"/>
      <stop offset="100%" stop-color="#e9d6b4"/>
    </linearGradient>
    <linearGradient id="tileBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfd3b8"/>
      <stop offset="100%" stop-color="#cbbc98"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Back tile (rotated, depth) -->
  <rect x="116" y="116" width="300" height="300" rx="44" fill="url(#tileBack)"
        transform="rotate(-7 256 256)" opacity="0.9"/>

  <!-- Main tile -->
  <rect x="106" y="106" width="300" height="300" rx="44" fill="url(#tile)" filter="url(#sh)"/>
  <rect x="124" y="124" width="264" height="264" rx="36" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="8"/>

  <!-- Letter -->
  <text x="256" y="346" font-family="Arial, Helvetica, sans-serif" font-size="216" font-weight="800"
        fill="#292524" text-anchor="middle">Б</text>
</svg>
