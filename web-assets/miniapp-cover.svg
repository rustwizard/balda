<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7ecd9"/>
      <stop offset="100%" stop-color="#e9d6b4"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Tiles spelling БАЛДА, centered: 5*96 + 4*16 = 544, x0 = 48, y = 132 -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#292524" text-anchor="middle">
    <g transform="rotate(-4 96 180)">
      <rect x="48" y="132" width="96" height="96" rx="16" fill="url(#tile)" filter="url(#sh)"/>
      <text x="96" y="205">Б</text>
    </g>
    <g transform="rotate(3 208 180)">
      <rect x="160" y="132" width="96" height="96" rx="16" fill="url(#tile)" filter="url(#sh)"/>
      <text x="208" y="205">А</text>
    </g>
    <g transform="rotate(-2 320 180)">
      <rect x="272" y="132" width="96" height="96" rx="16" fill="url(#tile)" filter="url(#sh)"/>
      <text x="320" y="205">Л</text>
    </g>
    <g transform="rotate(3 432 180)">
      <rect x="384" y="132" width="96" height="96" rx="16" fill="url(#tile)" filter="url(#sh)"/>
      <text x="432" y="205">Д</text>
    </g>
    <g transform="rotate(-4 544 180)">
      <rect x="496" y="132" width="96" height="96" rx="16" fill="url(#tile)" filter="url(#sh)"/>
      <text x="544" y="205">А</text>
    </g>
  </g>
</svg>
